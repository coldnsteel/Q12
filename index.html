<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q12 Portfolio Sentinel v3.0</title>
  <style>
    :root {
      --bg-color: #050505;
      --text-normal: #00ff00;
      --text-alert: #ff0000;
      --text-warn: #ffaa00;
      --panel-bg: #111111;
      --border-color: #003300;
    }
    body {
      background: var(--bg-color);
      color: var(--text-normal);
      font-family: 'Courier New', Courier, monospace;
      padding: 20px;
      margin: 0;
    }
    .header {
      background: #000;
      color: var(--text-normal);
      padding: 15px;
      text-align: center;
      font-weight: bold;
      border: 2px solid var(--text-normal);
      letter-spacing: 2px;
      font-size: 1.2em;
    }
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      margin: 20px 0;
    }
    .card {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      padding: 15px;
      border-radius: 4px;
      position: relative;
    }
    .card.breached {
      border: 1px solid var(--text-alert);
      background: rgba(255, 0, 0, 0.05);
    }
    .card-ticker {
      font-size: 1.4em;
      font-weight: bold;
      margin-bottom: 5px;
    }
    .card-price {
      font-size: 1.8em;
      font-weight: bold;
      color: #fff;
    }
    .card-change {
      font-size: 1.1em;
      font-weight: bold;
    }
    .change-up { color: var(--text-normal); }
    .change-down { color: var(--text-alert); }
    .alert-panel {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      padding: 15px;
      height: 200px;
      overflow-y: auto;
      border-radius: 4px;
    }
    .alert-entry {
      margin-bottom: 8px;
      border-bottom: 1px solid #222;
      padding-bottom: 4px;
      font-size: 0.9em;
    }
    .alert-active-text {
      color: var(--text-alert);
      font-weight: bold;
    }
    .meta-box {
      margin-top: 20px;
      font-size: 0.9em;
      color: #888;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <div class="header">Q12 PORTFOLIO SENTINEL • MULTI-AGENT TRACKING HUB</div>
  <div class="meta-box">
    <div>SYSTEM LOG: <span id="syncStatus" style="color: var(--text-normal);">ESTABLISHING CONNECTION...</span></div>
    <div>REFRESHING CYCLES IN: <span id="countdown">15s</span></div>
  </div>
  <div id="grid" class="grid-container"></div>
  <h3>Active Threshold Alerts</h3>
  <div id="alerts" class="alert-panel"></div>
  <div class="meta-box" style="margin-top: 40px; border-top: 1px solid var(--border-color); padding-top: 15px;">
    <div><strong>Contact:</strong> lexalytics@yahoo.com</div>
    <div><strong>Emmanuel - God With Us</strong></div>
  </div>
  <script>
    let countdownSecs = 15;
    const gridDiv = document.getElementById('grid');
    const alertsDiv = document.getElementById('alerts');
    const statusSpan = document.getElementById('syncStatus');
    const countdownSpan = document.getElementById('countdown');
    async function loadTelemetry() {
      try {
        const response = await fetch('q12_report.json');
        if (!response.ok) throw new Error('Empty report file');
        const data = await response.json();
        statusSpan.textContent = `ONLINE • LAST AUDIT: ${data.last_updated}`;
        statusSpan.style.color = 'var(--text-normal)';
        renderGrid(data.metrics, data.alerts);
        renderAlerts(data.alerts);
      } catch (err) {
        statusSpan.textContent = 'AWAITING LOCAL TELEMETRY SYNC...';
        statusSpan.style.color = 'var(--text-warn)';
      }
    }
    function renderGrid(metrics, alerts) {
      gridDiv.innerHTML = '';
      const activeAlertTickers = (alerts || []).map(a => a.ticker);
      for (const [ticker, info] of Object.entries(metrics)) {
        const card = document.createElement('div');
        const isBreached = activeAlertTickers.includes(ticker);
        card.className = `card ${isBreached ? 'breached' : ''}`;
        const isUp = info.change_pct >= 0;
        card.innerHTML = `
          <div class="card-ticker">${ticker} ${isBreached ? '⚠️' : ''}</div>
          <div class="card-price">$${info.price.toFixed(2)}</div>
          <div class="card-change ${isUp ? 'change-up' : 'change-down'}">
            ${isUp ? '▲' : '▼'} ${info.change_pct.toFixed(2)}%
          </div>
        `;
        gridDiv.appendChild(card);
      }
    }
    function renderAlerts(alerts) {
      alertsDiv.innerHTML = '';
      if (!alerts || alerts.length === 0) {
        alertsDiv.innerHTML = '<div style="color: #666; font-style: italic;">No threshold breaches registered in this tracking cycle.</div>';
        return;
      }
      alerts.forEach(alert => {
        const entry = document.createElement('div');
        entry.className = 'alert-entry';
        entry.innerHTML = `<span class="alert-active-text">${alert.message}</span>`;
        alertsDiv.appendChild(entry);
      });
    }
    setInterval(() => {
      countdownSecs--;
      if (countdownSecs <= 0) {
        countdownSecs = 15;
        loadTelemetry();
      }
      countdownSpan.textContent = `${countdownSecs}s`;
    }, 1000);
    loadTelemetry();
  </script>
</body>
</html>
